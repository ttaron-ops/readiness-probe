name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Built from the Gemfile with Jekyll 4 rather than
      # actions/jekyll-build-pages, which pins the github-pages gem to Jekyll
      # 3.10. Jekyll 3 ignores the `render_with_liquid: false` default in
      # _config.yml, so it parses lesson content as Liquid and dies on the
      # first literal {% or {{ — of which the lessons contain many, in
      # Prometheus alert templates, Go templates and Go struct literals.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # --baseurl is not optional. The site is served from
      # https://<user>.github.io/readiness-probe/, so without it every
      # root-absolute asset URL the theme emits — the stylesheet above all —
      # points at the domain root and 404s, and the site renders as unstyled
      # HTML. actions/jekyll-build-pages applied this automatically; a plain
      # `jekyll build` does not.
      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Catches the two ways this build has broken: a Liquid failure that
      # drops pages, and asset URLs that do not resolve under the baseurl.
      - name: Verify the built site
        run: |
          set -euo pipefail
          base="${{ steps.pages.outputs.base_path }}"
          lessons=$(find ./_site -name '*.html' -path '*lessons*' | wc -l)
          echo "lesson pages rendered: $lessons"
          [ "$lessons" -eq 149 ] || { echo "::error::expected 149 lesson pages, got $lessons"; exit 1; }
          css=$(grep -o 'href="[^"]*style\.css[^"]*"' ./_site/index.html | head -1 | sed 's/.*href="//; s/?.*//; s/"$//')
          echo "stylesheet href: $css"
          case "$css" in
            "$base"/*) ;;
            *) echo "::error::stylesheet href $css is not under baseurl $base — the site would render unstyled"; exit 1 ;;
          esac
          test -f "./_site${css#$base}" || { echo "::error::stylesheet missing from build output"; exit 1; }
          grep -q 'View on GitHub' ./_site/index.html || { echo "::error::theme header button missing — site.github metadata not populated"; exit 1; }
          echo "verification passed"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
